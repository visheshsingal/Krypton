plugins {
    id "com.android.application"
}

android {
    namespace "com.kryptonsecurity.mobile"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.kryptonsecurity.mobile"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "0.4.0"
    }

    dependencies {
        testImplementation "junit:junit:4.13.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
